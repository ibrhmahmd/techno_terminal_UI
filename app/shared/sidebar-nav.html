<!-- Precision Engine Sidebar Navigation Template -->
<!-- Usage: Include this in every page and set data-current-page attribute -->

<script>
function initNavigationState(currentPageId) {
  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item => {
    const pageId = item.getAttribute('data-page-id');
    if (pageId === currentPageId) {
      item.classList.add('active');
      item.setAttribute('aria-current', 'page');
    } else {
      item.classList.remove('active');
      item.removeAttribute('aria-current');
    }
  });
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', () => {
  const sidebar = document.querySelector('[data-sidebar-nav]');
  if (sidebar) {
    const currentPage = sidebar.getAttribute('data-current-page');
    initNavigationState(currentPage);
  }
});
</script>
